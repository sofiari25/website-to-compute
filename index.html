<!DOCTYPE html>
<html>
<head>
  <title>🌀 O SÍTIO DAS COISAS ERRADAS 🌀</title>
  <style>
    body {
      background: url('https://media.giphy.com/media/l0IylOPCNkiqOgMyA/giphy.gif');
      font-family: 'Papyrus', 'Comic Sans MS', cursive;
      color: chartreuse;
      margin: 50px;
      transform: rotate(1deg);
    }

    h1 {
      font-size: 72px;
      text-align: center;
      text-shadow: 5px 5px magenta;
    }

    .loucura {
      font-size: 8px;
      position: absolute;
      top: 75%;
      left: 85%;
      transform: rotate(-15deg);
      background-color: pink;
      border: 5px dotted cyan;
      padding: 20px;
      animation: girar 5s infinite linear;
    }

    @keyframes girar {
      0% { transform: rotate(0deg) translate(0,0); }
      100% { transform: rotate(360deg) translate(100px,100px); }
    }

    .link-bizarro {
      color: transparent;
      text-decoration: wavy underline red;
      font-size: 30px;
      background: linear-gradient(to right, red, blue, yellow, green);
      -webkit-background-clip: text;
    }

    .surpresa {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 48px;
      background-color: rgba(255,0,255,0.7);
    }
  </style>
</head>
<body>

  <h1>💥 BEM-VINDO AO ABSURDO 💥</h1>

  <div class="loucura">
    <p>você está sendo observado 👁️</p>
    <p>nada faz sentido</p>
  </div>

  <p>
    Clique <a href="#" class="link-bizarro" onclick="alert('NÃO ERA PRA CLICAR!')">aqui</a> para confusão.
  </p>

  <div class="surpresa">
    ☢️ MÚSICA DE FUNDO ATIVADA (invisível)
  </div>

  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

</body>
</html>
